apiVersion: 1

datasources:
  - name: ClickHouse
    uid: clickhouse-uid
    type: grafana-clickhouse-datasource
    access: proxy
    url: http://clickhouse:8123
    jsonData:
      host: clickhouse
      port: 8123
      username: default
      defaultDatabase: payments
      protocol: http
    secureJsonData:
      password: ""
    isDefault: true
